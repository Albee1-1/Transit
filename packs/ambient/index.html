<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ambient</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050510;
      overflow: hidden;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Weather overlay (placeholder) */
    .weather-overlay {
      position: fixed;
      bottom: 30px;
      right: 40px;
      color: rgba(255, 255, 255, 0.25);
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 14px;
      text-align: right;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    .weather-overlay.hidden { opacity: 0; }

    .weather-overlay .temp {
      font-size: 48px;
      font-weight: 200;
      line-height: 1;
    }
    .weather-overlay .desc {
      margin-top: 4px;
      font-size: 16px;
    }

    /* Tiny clock in corner */
    .corner-clock {
      position: fixed;
      bottom: 30px;
      left: 40px;
      color: rgba(255, 255, 255, 0.15);
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 24px;
      font-weight: 200;
      pointer-events: none;
    }

    /* Settings */
    .settings-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      color: #222;
      font-size: 20px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
    }
    body:hover .settings-btn { opacity: 1; }

    .settings-panel {
      position: fixed;
      top: 50px;
      right: 12px;
      background: rgba(20, 20, 30, 0.95);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      display: none;
      z-index: 10;
      min-width: 220px;
    }
    .settings-panel.open { display: block; }

    .settings-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 0;
    }

    .settings-panel select, .settings-panel input[type="checkbox"] {
      accent-color: #81c784;
    }

    .settings-panel select {
      background: #1a1a2a;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px;
    }

    .reload-indicator {
      position: fixed;
      bottom: 8px;
      left: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #1a1a2a;
    }
    .reload-indicator.connected { background: #4caf50; }
  </style>
</head>
<body>
  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
  <div class="settings-panel" id="settingsPanel">
    <label>
      Theme
      <select id="themeSelect" onchange="saveSettings()">
        <option value="aurora">Aurora</option>
        <option value="ocean">Ocean Waves</option>
        <option value="gradient">Gradient Drift</option>
      </select>
    </label>
    <label>
      <input type="checkbox" id="showWeather" onchange="saveSettings()" />
      Show weather (placeholder)
    </label>
    <label>
      <input type="checkbox" id="showClock" checked onchange="saveSettings()" />
      Show corner clock
    </label>
  </div>

  <canvas id="canvas"></canvas>

  <div class="weather-overlay hidden" id="weatherOverlay">
    <div class="temp">--&deg;</div>
    <div class="desc">Weather unavailable</div>
  </div>

  <div class="corner-clock" id="cornerClock"></div>
  <div class="reload-indicator" id="sseIndicator"></div>

  <script>
    const PACK_ID = 'ambient';
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let theme = 'aurora';
    let showWeather = false;
    let showClock = true;
    let animFrame;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ── Themes ───────────────────────────────────────────────
    const themes = {
      aurora: {
        colors: ['#0b3d2e', '#1a237e', '#4a148c', '#006064', '#1b5e20'],
        speed: 0.0004,
        layers: 5,
      },
      ocean: {
        colors: ['#01579b', '#0277bd', '#0288d1', '#039be5', '#0d47a1'],
        speed: 0.0006,
        layers: 6,
      },
      gradient: {
        colors: ['#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3'],
        speed: 0.0003,
        layers: 4,
      },
    };

    function draw(t) {
      const cfg = themes[theme] || themes.aurora;
      const w = canvas.width;
      const h = canvas.height;

      // Dark fade
      ctx.fillStyle = 'rgba(5, 5, 16, 0.03)';
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < cfg.layers; i++) {
        const color = cfg.colors[i % cfg.colors.length];
        const phase = t * cfg.speed + i * 1.2;
        const amplitude = h * 0.15;
        const yBase = h * (0.25 + i * 0.12);

        ctx.beginPath();
        ctx.moveTo(0, h);

        for (let x = 0; x <= w; x += 4) {
          const y = yBase
            + Math.sin(x * 0.003 + phase) * amplitude
            + Math.sin(x * 0.001 - phase * 0.7) * amplitude * 0.5
            + Math.cos(x * 0.005 + phase * 1.3 + i) * amplitude * 0.3;
          ctx.lineTo(x, y);
        }

        ctx.lineTo(w, h);
        ctx.closePath();

        ctx.fillStyle = color + '18'; // low alpha hex
        ctx.fill();

        // Glow line on top
        ctx.beginPath();
        for (let x = 0; x <= w; x += 4) {
          const y = yBase
            + Math.sin(x * 0.003 + phase) * amplitude
            + Math.sin(x * 0.001 - phase * 0.7) * amplitude * 0.5
            + Math.cos(x * 0.005 + phase * 1.3 + i) * amplitude * 0.3;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = color + '30';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      animFrame = requestAnimationFrame(draw);
    }

    function startAnimation() {
      if (animFrame) cancelAnimationFrame(animFrame);
      // Clear canvas for theme switch
      ctx.fillStyle = '#050510';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      animFrame = requestAnimationFrame(draw);
    }

    // ── Corner clock ─────────────────────────────────────────
    function updateCornerClock() {
      const el = document.getElementById('cornerClock');
      if (!showClock) { el.style.opacity = '0'; return; }
      el.style.opacity = '';
      const now = new Date();
      const h = String(now.getHours() % 12 || 12).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      el.textContent = `${h}:${m}`;
    }

    // ── Weather placeholder ──────────────────────────────────
    function updateWeatherVisibility() {
      const el = document.getElementById('weatherOverlay');
      el.classList.toggle('hidden', !showWeather);
    }

    // ── Settings ─────────────────────────────────────────────
    async function loadSettings() {
      try {
        const res = await fetch(`/api/config/${PACK_ID}`);
        const cfg = await res.json();
        if (cfg.theme) theme = cfg.theme;
        if (cfg.showWeather !== undefined) showWeather = cfg.showWeather;
        if (cfg.showClock !== undefined) showClock = cfg.showClock;
        document.getElementById('themeSelect').value = theme;
        document.getElementById('showWeather').checked = showWeather;
        document.getElementById('showClock').checked = showClock;
      } catch {}
      startAnimation();
      updateWeatherVisibility();
    }

    async function saveSettings() {
      theme = document.getElementById('themeSelect').value;
      showWeather = document.getElementById('showWeather').checked;
      showClock = document.getElementById('showClock').checked;
      updateWeatherVisibility();
      startAnimation();
      try {
        await fetch(`/api/config/${PACK_ID}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ theme, showWeather, showClock }),
        });
      } catch {}
    }

    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
      const panel = document.getElementById('settingsPanel');
      const btn = document.querySelector('.settings-btn');
      if (!panel.contains(e.target) && e.target !== btn) {
        panel.classList.remove('open');
      }
    });

    // ── SSE ──────────────────────────────────────────────────
    function connectSSE() {
      const indicator = document.getElementById('sseIndicator');
      const es = new EventSource('/api/events');
      es.onopen = () => indicator.classList.add('connected');
      es.addEventListener('packChanged', (e) => {
        const data = JSON.parse(e.data);
        if (data.activePackId !== PACK_ID) {
          window.location.href = '/';
        }
      });
      es.onerror = () => {
        indicator.classList.remove('connected');
        es.close();
        setTimeout(connectSSE, 5000);
      };
    }

    loadSettings();
    updateCornerClock();
    setInterval(updateCornerClock, 30000);
    connectSSE();
  </script>
</body>
</html>
