<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plasma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; height: 100vh; user-select: none; }
    canvas { display: block; image-rendering: pixelated; }
    .clock-overlay {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; z-index: 10; transition: opacity 0.5s;
    }
    .clock-overlay.hidden { opacity: 0; }
    .clock-overlay .time { font-family: 'Inter', sans-serif; font-size: 16vw; font-weight: 100; color: rgba(255,255,255,0.08); letter-spacing: 0.05em; mix-blend-mode: overlay; }
    .settings-btn { position: fixed; top: 16px; right: 16px; background: none; border: none; color: #333; font-size: 22px; cursor: pointer; opacity: 0; transition: opacity 0.3s; z-index: 100; }
    body:hover .settings-btn { opacity: 1; }
    .settings-panel { position: fixed; top: 60px; right: 16px; background: rgba(10,5,15,0.95); border: 1px solid #2a1a3a; border-radius: 12px; padding: 20px; display: none; z-index: 100; min-width: 220px; backdrop-filter: blur(20px); }
    .settings-panel.open { display: block; }
    .settings-panel h3 { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; color: #8a3a6a; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    .settings-panel label { display: flex; align-items: center; gap: 10px; color: #cc66aa; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; padding: 6px 0; }
    .settings-panel select { background: #0a0510; color: #cc66aa; border: 1px solid #2a1a3a; border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: 'Inter', sans-serif; width: 100%; margin-top: 4px; }
    .settings-panel input[type="checkbox"] { accent-color: #ff4081; width: 16px; height: 16px; }
    .setting-group { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #1a0a2a; }
    .setting-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .reload-indicator { position: fixed; bottom: 8px; left: 8px; width: 5px; height: 5px; border-radius: 50%; background: #0a0a0a; z-index: 20; }
    .reload-indicator.connected { background: #ff4081; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="clock-overlay hidden" id="clockOverlay"><div class="time" id="clockTime"></div></div>
  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-group">
      <h3>Palette</h3>
      <label><select id="palette" onchange="saveSettings()">
        <option value="classic">Classic</option>
        <option value="ocean">Ocean</option>
        <option value="lava">Lava</option>
        <option value="acid">Acid</option>
        <option value="pastel">Pastel</option>
      </select></label>
    </div>
    <div class="setting-group">
      <h3>Speed</h3>
      <label><select id="speed" onchange="saveSettings()">
        <option value="slow">Slow</option>
        <option value="normal" selected>Normal</option>
        <option value="fast">Fast</option>
      </select></label>
    </div>
    <div class="setting-group">
      <h3>Display</h3>
      <label><input type="checkbox" id="showClock" onchange="saveSettings()" /> Show clock</label>
    </div>
  </div>
  <div class="reload-indicator" id="sseIndicator"></div>

  <script>
    const PACK_ID = 'plasma';
    const C = document.getElementById('canvas');
    const ctx = C.getContext('2d');

    let palette = 'classic';
    let speed = 'normal';
    let showClock = false;

    const SPEED_MAP = { slow: 0.3, normal: 0.7, fast: 1.5 };

    // Lower res for performance
    const SCALE = 4;
    let W, H, imgData;

    function resize() {
      W = Math.ceil(window.innerWidth / SCALE);
      H = Math.ceil(window.innerHeight / SCALE);
      C.width = W;
      C.height = H;
      C.style.width = window.innerWidth + 'px';
      C.style.height = window.innerHeight + 'px';
      imgData = ctx.createImageData(W, H);
    }
    window.addEventListener('resize', resize);
    resize();

    function paletteColor(v) {
      // v is 0-1
      v = v % 1;
      switch (palette) {
        case 'ocean':
          return [
            Math.sin(v * Math.PI * 2) * 30 + 10,
            Math.sin(v * Math.PI * 2 + 1) * 80 + 100,
            Math.sin(v * Math.PI * 2 + 2) * 80 + 175,
          ];
        case 'lava':
          return [
            Math.sin(v * Math.PI * 2) * 100 + 155,
            Math.sin(v * Math.PI * 2 + 0.5) * 80 + 60,
            Math.sin(v * Math.PI * 2 + 3) * 20 + 10,
          ];
        case 'acid':
          return [
            Math.sin(v * Math.PI * 2 + 4) * 80 + 80,
            Math.sin(v * Math.PI * 2) * 100 + 155,
            Math.sin(v * Math.PI * 2 + 2) * 40 + 20,
          ];
        case 'pastel':
          return [
            Math.sin(v * Math.PI * 2) * 60 + 180,
            Math.sin(v * Math.PI * 2 + 2) * 60 + 170,
            Math.sin(v * Math.PI * 2 + 4) * 60 + 190,
          ];
        default: // classic
          return [
            Math.sin(v * Math.PI * 2) * 127 + 128,
            Math.sin(v * Math.PI * 2 + 2.094) * 127 + 128,
            Math.sin(v * Math.PI * 2 + 4.189) * 127 + 128,
          ];
      }
    }

    function animate(ts) {
      const t = ts * 0.001 * (SPEED_MAP[speed] || 0.7);
      const data = imgData.data;

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const v1 = Math.sin(x * 0.03 + t);
          const v2 = Math.sin(y * 0.03 + t * 0.7);
          const v3 = Math.sin((x * 0.02 + y * 0.02) + t * 0.5);
          const v4 = Math.sin(Math.sqrt((x - W/2) * (x - W/2) + (y - H/2) * (y - H/2)) * 0.04 - t);
          const v5 = Math.sin(x * 0.01 * Math.sin(t * 0.1) + y * 0.01 * Math.cos(t * 0.12));

          const val = (v1 + v2 + v3 + v4 + v5 + 5) / 10;
          const [r, g, b] = paletteColor(val);

          const i = (y * W + x) * 4;
          data[i]     = r;
          data[i + 1] = g;
          data[i + 2] = b;
          data[i + 3] = 255;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      requestAnimationFrame(animate);
    }

    function updateClock() {
      const el = document.getElementById('clockOverlay');
      el.className = showClock ? 'clock-overlay' : 'clock-overlay hidden';
      if (!showClock) return;
      const now = new Date();
      document.getElementById('clockTime').textContent = `${String(now.getHours() % 12 || 12).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/config/' + PACK_ID);
        const cfg = await res.json();
        if (cfg.palette) palette = cfg.palette;
        if (cfg.speed) speed = cfg.speed;
        if (cfg.showClock !== undefined) showClock = cfg.showClock;
        document.getElementById('palette').value = palette;
        document.getElementById('speed').value = speed;
        document.getElementById('showClock').checked = showClock;
      } catch {}
      updateClock();
    }
    async function saveSettings() {
      palette = document.getElementById('palette').value;
      speed = document.getElementById('speed').value;
      showClock = document.getElementById('showClock').checked;
      updateClock();
      try { await fetch('/api/config/' + PACK_ID, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ palette, speed, showClock }) }); } catch {}
    }
    function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
    document.addEventListener('click', (e) => { const p = document.getElementById('settingsPanel'); if (!p.contains(e.target) && !e.target.closest('.settings-btn')) p.classList.remove('open'); });
    function connectSSE() {
      const ind = document.getElementById('sseIndicator'); const es = new EventSource('/api/events');
      es.onopen = () => ind.classList.add('connected');
      es.addEventListener('packChanged', (e) => { const d = JSON.parse(e.data); if (d.activePackId !== PACK_ID) window.location.href = '/'; });
      es.onerror = () => { ind.classList.remove('connected'); es.close(); setTimeout(connectSSE, 5000); };
    }
    loadSettings(); setInterval(updateClock, 30000); requestAnimationFrame(animate); connectSSE();
  </script>
</body>
</html>
