<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snowfall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a1020; overflow: hidden; height: 100vh; user-select: none; }
    canvas { display: block; }
    .clock-overlay {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; z-index: 10; transition: opacity 0.5s;
    }
    .clock-overlay.hidden { opacity: 0; }
    .clock-overlay .time { font-family: 'Inter', sans-serif; font-size: 14vw; font-weight: 100; color: rgba(200,220,240,0.05); letter-spacing: 0.05em; }
    .settings-btn { position: fixed; top: 16px; right: 16px; background: none; border: none; color: #1a2030; font-size: 22px; cursor: pointer; opacity: 0; transition: opacity 0.3s; z-index: 100; }
    body:hover .settings-btn { opacity: 1; }
    .settings-panel { position: fixed; top: 60px; right: 16px; background: rgba(10,16,32,0.95); border: 1px solid #1a2a40; border-radius: 12px; padding: 20px; display: none; z-index: 100; min-width: 220px; backdrop-filter: blur(20px); }
    .settings-panel.open { display: block; }
    .settings-panel h3 { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; color: #4a6a8a; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    .settings-panel label { display: flex; align-items: center; gap: 10px; color: #8aafcf; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; padding: 6px 0; }
    .settings-panel select { background: #0c1424; color: #8aafcf; border: 1px solid #1a2a40; border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: 'Inter', sans-serif; width: 100%; margin-top: 4px; }
    .settings-panel input[type="checkbox"] { accent-color: #b3e5fc; width: 16px; height: 16px; }
    .setting-group { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #0e1a2a; }
    .setting-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .reload-indicator { position: fixed; bottom: 8px; left: 8px; width: 5px; height: 5px; border-radius: 50%; background: #0a0a18; z-index: 20; }
    .reload-indicator.connected { background: #b3e5fc; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="clock-overlay hidden" id="clockOverlay"><div class="time" id="clockTime"></div></div>
  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-group">
      <h3>Intensity</h3>
      <label><select id="intensity" onchange="saveSettings()">
        <option value="light">Light Flurry</option>
        <option value="normal" selected>Steady Snow</option>
        <option value="blizzard">Blizzard</option>
      </select></label>
    </div>
    <div class="setting-group">
      <h3>Scene</h3>
      <label><select id="scene" onchange="saveSettings()">
        <option value="night" selected>Night</option>
        <option value="dusk">Dusk</option>
        <option value="cozy">Cozy Cabin</option>
      </select></label>
    </div>
    <div class="setting-group">
      <h3>Display</h3>
      <label><input type="checkbox" id="showClock" onchange="saveSettings()" /> Show clock</label>
    </div>
  </div>
  <div class="reload-indicator" id="sseIndicator"></div>

  <script>
    const PACK_ID = 'snowfall';
    const C = document.getElementById('canvas');
    const ctx = C.getContext('2d');
    let W, H;

    let intensity = 'normal';
    let scene = 'night';
    let showClock = false;

    const COUNTS = { light: 150, normal: 400, blizzard: 900 };
    let flakes = [];
    let accumulation = [];

    function resize() {
      W = C.width = window.innerWidth;
      H = C.height = window.innerHeight;
      accumulation = new Float32Array(W).fill(0);
      initFlakes();
    }
    window.addEventListener('resize', resize);
    resize();

    function initFlakes() {
      const count = COUNTS[intensity] || 400;
      flakes = [];
      for (let i = 0; i < count; i++) flakes.push(createFlake(true));
    }

    function createFlake(randomY) {
      const depth = Math.random();
      return {
        x: Math.random() * W * 1.2 - W * 0.1,
        y: randomY ? Math.random() * H : -5 - Math.random() * 50,
        r: 1 + depth * 3,
        speed: 0.5 + depth * 1.5,
        wind: (intensity === 'blizzard' ? 1.5 : 0.5) * (Math.random() - 0.3),
        wobblePhase: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.5 + Math.random() * 1.5,
        wobbleAmp: 0.3 + Math.random() * 0.8,
        alpha: 0.3 + depth * 0.5,
        depth,
      };
    }

    function drawBackground() {
      const colors = {
        night: ['#0a1020', '#0c1428', '#121a30'],
        dusk:  ['#1a1030', '#2a1838', '#1a1428'],
        cozy:  ['#0c0a08', '#120e0a', '#1a1410'],
      };
      const c = colors[scene] || colors.night;
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, c[0]);
      grad.addColorStop(0.6, c[1]);
      grad.addColorStop(1, c[2]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }

    function drawGround() {
      // Snow-covered ground
      const groundH = H * 0.12;
      ctx.fillStyle = '#e8eef4';
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 5) {
        const snowH = groundH + Math.sin(x * 0.01) * 8 + Math.sin(x * 0.03) * 4 + (accumulation[x] || 0) * 0.02;
        ctx.lineTo(x, H - snowH);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      const groundGrad = ctx.createLinearGradient(0, H - groundH - 20, 0, H);
      groundGrad.addColorStop(0, scene === 'night' ? '#c8d4e0' : '#dde6ef');
      groundGrad.addColorStop(1, scene === 'night' ? '#a0b0c0' : '#c8d4e0');
      ctx.fillStyle = groundGrad;
      ctx.fill();

      // Trees silhouettes
      if (scene !== 'cozy') {
        ctx.fillStyle = scene === 'night' ? '#0a1420' : '#1a1028';
        const treePositions = [W * 0.08, W * 0.22, W * 0.45, W * 0.65, W * 0.8, W * 0.93];
        for (const tx of treePositions) {
          const treeH = H * 0.15 + Math.sin(tx) * H * 0.05;
          const baseY = H - groundH - 5;
          // Trunk
          ctx.fillRect(tx - 3, baseY - treeH * 0.3, 6, treeH * 0.3);
          // Triangular canopy
          ctx.beginPath();
          ctx.moveTo(tx, baseY - treeH);
          ctx.lineTo(tx - 25 - Math.random() * 10, baseY);
          ctx.lineTo(tx + 25 + Math.random() * 10, baseY);
          ctx.closePath();
          ctx.fill();
          // Snow on tree
          ctx.fillStyle = '#d0dae4';
          ctx.beginPath();
          ctx.moveTo(tx, baseY - treeH + 2);
          ctx.lineTo(tx - 12, baseY - treeH * 0.6);
          ctx.lineTo(tx + 12, baseY - treeH * 0.6);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = scene === 'night' ? '#0a1420' : '#1a1028';
        }
      }

      // Cozy cabin
      if (scene === 'cozy') {
        const bx = W * 0.5 - 60;
        const by = H - groundH - 80;
        ctx.fillStyle = '#2a1a0c';
        ctx.fillRect(bx, by, 120, 80);
        // Roof
        ctx.fillStyle = '#1a100a';
        ctx.beginPath();
        ctx.moveTo(bx - 15, by);
        ctx.lineTo(bx + 60, by - 40);
        ctx.lineTo(bx + 135, by);
        ctx.closePath();
        ctx.fill();
        // Snow on roof
        ctx.fillStyle = '#d8e2ec';
        ctx.beginPath();
        ctx.moveTo(bx - 15, by);
        ctx.lineTo(bx + 60, by - 38);
        ctx.lineTo(bx + 135, by);
        ctx.lineTo(bx + 130, by + 5);
        ctx.lineTo(bx + 60, by - 32);
        ctx.lineTo(bx - 10, by + 5);
        ctx.closePath();
        ctx.fill();
        // Window glow
        ctx.fillStyle = 'rgba(255, 200, 100, 0.6)';
        ctx.fillRect(bx + 20, by + 20, 25, 25);
        ctx.fillRect(bx + 70, by + 20, 25, 25);
        // Window glow aura
        const wGlow = ctx.createRadialGradient(bx + 32, by + 32, 0, bx + 32, by + 32, 60);
        wGlow.addColorStop(0, 'rgba(255,200,100,0.06)');
        wGlow.addColorStop(1, 'transparent');
        ctx.fillStyle = wGlow;
        ctx.fillRect(bx - 30, by - 30, 180, 140);
      }
    }

    function drawSnow(t, dt) {
      for (const f of flakes) {
        const wobble = Math.sin(t * f.wobbleSpeed + f.wobblePhase) * f.wobbleAmp;

        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 235, 250, ${f.alpha})`;
        ctx.fill();

        // Slight sparkle on larger flakes
        if (f.r > 2.5 && Math.random() < 0.01) {
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r * 1.5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.15)';
          ctx.fill();
        }

        f.x += (f.wind + wobble) * dt * 60;
        f.y += f.speed * dt * 60;

        const groundLevel = H * 0.88;
        if (f.y > groundLevel) {
          const ix = Math.floor(f.x);
          if (ix >= 0 && ix < W) accumulation[ix] += f.r;
          Object.assign(f, createFlake(false));
        }
        if (f.x < -20) f.x = W + 20;
        if (f.x > W + 20) f.x = -20;
      }
    }

    let lastTime = 0;
    function animate(ts) {
      const t = ts * 0.001;
      const dt = Math.min((ts - lastTime) * 0.001, 0.05);
      lastTime = ts;

      drawBackground();
      drawGround();
      drawSnow(t, dt);

      requestAnimationFrame(animate);
    }

    function updateClock() {
      const el = document.getElementById('clockOverlay');
      el.className = showClock ? 'clock-overlay' : 'clock-overlay hidden';
      if (!showClock) return;
      const now = new Date();
      document.getElementById('clockTime').textContent = `${String(now.getHours() % 12 || 12).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/config/' + PACK_ID);
        const cfg = await res.json();
        if (cfg.intensity) intensity = cfg.intensity;
        if (cfg.scene) scene = cfg.scene;
        if (cfg.showClock !== undefined) showClock = cfg.showClock;
        document.getElementById('intensity').value = intensity;
        document.getElementById('scene').value = scene;
        document.getElementById('showClock').checked = showClock;
      } catch {}
      initFlakes(); updateClock();
    }
    async function saveSettings() {
      intensity = document.getElementById('intensity').value;
      scene = document.getElementById('scene').value;
      showClock = document.getElementById('showClock').checked;
      initFlakes(); updateClock();
      try { await fetch('/api/config/' + PACK_ID, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ intensity, scene, showClock }) }); } catch {}
    }
    function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
    document.addEventListener('click', (e) => { const p = document.getElementById('settingsPanel'); if (!p.contains(e.target) && !e.target.closest('.settings-btn')) p.classList.remove('open'); });
    function connectSSE() {
      const ind = document.getElementById('sseIndicator'); const es = new EventSource('/api/events');
      es.onopen = () => ind.classList.add('connected');
      es.addEventListener('packChanged', (e) => { const d = JSON.parse(e.data); if (d.activePackId !== PACK_ID) window.location.href = '/'; });
      es.onerror = () => { ind.classList.remove('connected'); es.close(); setTimeout(connectSSE, 5000); };
    }
    loadSettings(); setInterval(updateClock, 30000); requestAnimationFrame(animate); connectSSE();
  </script>
</body>
</html>
