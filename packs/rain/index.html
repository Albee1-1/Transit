<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e14; overflow: hidden; height: 100vh; user-select: none; }
    canvas { display: block; }

    .clock-overlay {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; z-index: 10; transition: opacity 0.5s;
    }
    .clock-overlay.hidden { opacity: 0; }
    .clock-overlay .time {
      font-family: 'Inter', sans-serif; font-size: 14vw; font-weight: 100;
      color: rgba(180,200,220,0.06); letter-spacing: 0.05em;
    }

    .settings-btn {
      position: fixed; top: 16px; right: 16px;
      background: none; border: none; color: #1a2535;
      font-size: 22px; cursor: pointer; opacity: 0;
      transition: opacity 0.3s; z-index: 100;
    }
    body:hover .settings-btn { opacity: 1; }
    .settings-panel {
      position: fixed; top: 60px; right: 16px;
      background: rgba(8,12,20,0.95); border: 1px solid #1a2a3a;
      border-radius: 12px; padding: 20px; display: none;
      z-index: 100; min-width: 220px; backdrop-filter: blur(20px);
    }
    .settings-panel.open { display: block; }
    .settings-panel h3 {
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400;
      color: #3a5a7a; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px;
    }
    .settings-panel label {
      display: flex; align-items: center; gap: 10px;
      color: #6a8aaa; font-family: 'Inter', sans-serif; font-size: 13px;
      cursor: pointer; padding: 6px 0;
    }
    .settings-panel select {
      background: #0a1018; color: #6a8aaa; border: 1px solid #1a2a3a;
      border-radius: 6px; padding: 6px 10px; font-size: 13px;
      font-family: 'Inter', sans-serif; width: 100%; margin-top: 4px;
    }
    .settings-panel input[type="checkbox"] { accent-color: #5b8cbe; width: 16px; height: 16px; }
    .setting-group { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #0e1a28; }
    .setting-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .reload-indicator {
      position: fixed; bottom: 8px; left: 8px;
      width: 5px; height: 5px; border-radius: 50%; background: #0a0a15; z-index: 20;
    }
    .reload-indicator.connected { background: #5b8cbe; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="clock-overlay hidden" id="clockOverlay">
    <div class="time" id="clockTime"></div>
  </div>

  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-group">
      <h3>Rain Intensity</h3>
      <label>
        <select id="rainIntensity" onchange="saveSettings()">
          <option value="drizzle">Drizzle</option>
          <option value="steady" selected>Steady</option>
          <option value="downpour">Downpour</option>
        </select>
      </label>
    </div>
    <div class="setting-group">
      <h3>Backdrop</h3>
      <label>
        <select id="backdrop" onchange="saveSettings()">
          <option value="city">City Lights</option>
          <option value="dark">Dark</option>
          <option value="twilight">Twilight</option>
        </select>
      </label>
    </div>
    <div class="setting-group">
      <h3>Overlay</h3>
      <label><input type="checkbox" id="showClock" onchange="saveSettings()" /> Show clock</label>
      <label><input type="checkbox" id="showDroplets" checked onchange="saveSettings()" /> Window droplets</label>
    </div>
  </div>

  <div class="reload-indicator" id="sseIndicator"></div>

  <script>
    const PACK_ID = 'rain';
    const C = document.getElementById('canvas');
    const ctx = C.getContext('2d');
    let W, H;

    let rainIntensity = 'steady';
    let backdrop = 'city';
    let showClock = false;
    let showDroplets = true;

    const RAIN_COUNTS = { drizzle: 150, steady: 400, downpour: 800 };

    let raindrops = [];
    let droplets = []; // static droplets on the glass
    let cityLights = [];

    function resize() {
      W = C.width = window.innerWidth;
      H = C.height = window.innerHeight;
      initScene();
    }
    window.addEventListener('resize', resize);

    function initScene() {
      initRain();
      initDroplets();
      initCityLights();
    }

    function initRain() {
      const count = RAIN_COUNTS[rainIntensity] || 400;
      raindrops = [];
      for (let i = 0; i < count; i++) {
        raindrops.push(createRaindrop(true));
      }
    }

    function createRaindrop(randomY) {
      const depth = Math.random(); // 0 = far, 1 = close
      return {
        x: Math.random() * W * 1.2 - W * 0.1,
        y: randomY ? Math.random() * H : -10 - Math.random() * 100,
        length: 10 + depth * 25,
        speed: 8 + depth * 16,
        width: 0.5 + depth * 1.5,
        alpha: 0.1 + depth * 0.3,
        drift: -1 - Math.random() * 2,
        depth: depth,
      };
    }

    function initDroplets() {
      droplets = [];
      if (!showDroplets) return;
      for (let i = 0; i < 60; i++) {
        droplets.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 2 + Math.random() * 8,
          alpha: 0.05 + Math.random() * 0.1,
          drip: Math.random() < 0.15,
          dripLength: 20 + Math.random() * 60,
          dripSpeed: 0.1 + Math.random() * 0.3,
          dripProgress: 0,
        });
      }
    }

    function initCityLights() {
      cityLights = [];
      if (backdrop !== 'city') return;
      for (let i = 0; i < 80; i++) {
        cityLights.push({
          x: Math.random() * W,
          y: H * 0.3 + Math.random() * H * 0.5,
          r: 2 + Math.random() * 6,
          hue: Math.random() < 0.6 ? 40 + Math.random() * 20 : 200 + Math.random() * 40,
          alpha: 0.02 + Math.random() * 0.06,
          flicker: Math.random() * Math.PI * 2,
          flickerSpeed: 0.5 + Math.random() * 2,
        });
      }
    }

    function drawBackground(t) {
      const bgColors = {
        city: ['#0a0e14', '#0e1520', '#121a28'],
        dark: ['#050508', '#080a0e', '#0a0c12'],
        twilight: ['#0c0a18', '#141028', '#1a1430'],
      };
      const c = bgColors[backdrop] || bgColors.city;
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, c[0]);
      grad.addColorStop(0.5, c[1]);
      grad.addColorStop(1, c[2]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Blurry city lights in background
      if (backdrop === 'city') {
        for (const light of cityLights) {
          const flicker = 0.7 + Math.sin(t * light.flickerSpeed + light.flicker) * 0.3;
          const grad = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, light.r * 8);
          grad.addColorStop(0, `hsla(${light.hue}, 60%, 70%, ${light.alpha * flicker})`);
          grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad;
          ctx.fillRect(light.x - light.r * 8, light.y - light.r * 8, light.r * 16, light.r * 16);
        }
      }
    }

    function drawRain(dt) {
      for (const drop of raindrops) {
        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x + drop.drift * 0.5, drop.y + drop.length);
        ctx.strokeStyle = `rgba(170,190,210,${drop.alpha})`;
        ctx.lineWidth = drop.width;
        ctx.stroke();

        drop.x += drop.drift * dt * 60;
        drop.y += drop.speed * dt * 60;

        if (drop.y > H + 20) {
          Object.assign(drop, createRaindrop(false));
        }
      }
    }

    function drawDroplets(t) {
      if (!showDroplets) return;
      for (const d of droplets) {
        // Main droplet
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(d.x - d.r * 0.3, d.y - d.r * 0.3, 0, d.x, d.y, d.r);
        grad.addColorStop(0, `rgba(200,220,240,${d.alpha * 1.5})`);
        grad.addColorStop(0.7, `rgba(150,180,210,${d.alpha})`);
        grad.addColorStop(1, `rgba(120,150,180,${d.alpha * 0.5})`);
        ctx.fillStyle = grad;
        ctx.fill();

        // Highlight
        ctx.beginPath();
        ctx.arc(d.x - d.r * 0.25, d.y - d.r * 0.25, d.r * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${d.alpha * 2})`;
        ctx.fill();

        // Drip trail
        if (d.drip) {
          d.dripProgress += d.dripSpeed * 0.01;
          if (d.dripProgress > 1) d.dripProgress = 0;
          const dripY = d.y + d.r + d.dripLength * d.dripProgress;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y + d.r);
          ctx.quadraticCurveTo(d.x + 2, d.y + d.r + d.dripLength * 0.5 * d.dripProgress, d.x, dripY);
          ctx.strokeStyle = `rgba(170,200,220,${d.alpha * (1 - d.dripProgress)})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    // Glass fog/condensation overlay
    function drawGlassEffect() {
      ctx.fillStyle = 'rgba(100,120,140,0.01)';
      ctx.fillRect(0, 0, W, H);
    }

    let lastTime = 0;
    function animate(ts) {
      const t = ts * 0.001;
      const dt = Math.min((ts - lastTime) * 0.001, 0.05);
      lastTime = ts;

      drawBackground(t);
      drawDroplets(t);
      drawRain(dt);
      drawGlassEffect();

      requestAnimationFrame(animate);
    }

    function updateClock() {
      const el = document.getElementById('clockOverlay');
      el.className = showClock ? 'clock-overlay' : 'clock-overlay hidden';
      if (!showClock) return;
      const now = new Date();
      const h = String(now.getHours() % 12 || 12).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockTime').textContent = `${h}:${m}`;
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/config/' + PACK_ID);
        const cfg = await res.json();
        if (cfg.rainIntensity) rainIntensity = cfg.rainIntensity;
        if (cfg.backdrop) backdrop = cfg.backdrop;
        if (cfg.showClock !== undefined) showClock = cfg.showClock;
        if (cfg.showDroplets !== undefined) showDroplets = cfg.showDroplets;
        document.getElementById('rainIntensity').value = rainIntensity;
        document.getElementById('backdrop').value = backdrop;
        document.getElementById('showClock').checked = showClock;
        document.getElementById('showDroplets').checked = showDroplets;
      } catch {}
      resize();
      updateClock();
    }

    async function saveSettings() {
      rainIntensity = document.getElementById('rainIntensity').value;
      backdrop = document.getElementById('backdrop').value;
      showClock = document.getElementById('showClock').checked;
      showDroplets = document.getElementById('showDroplets').checked;
      resize();
      updateClock();
      try {
        await fetch('/api/config/' + PACK_ID, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rainIntensity, backdrop, showClock, showDroplets }),
        });
      } catch {}
    }

    function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
    document.addEventListener('click', (e) => {
      const p = document.getElementById('settingsPanel');
      if (!p.contains(e.target) && !e.target.closest('.settings-btn')) p.classList.remove('open');
    });

    function connectSSE() {
      const ind = document.getElementById('sseIndicator');
      const es = new EventSource('/api/events');
      es.onopen = () => ind.classList.add('connected');
      es.addEventListener('packChanged', (e) => {
        const d = JSON.parse(e.data);
        if (d.activePackId !== PACK_ID) window.location.href = '/';
      });
      es.onerror = () => { ind.classList.remove('connected'); es.close(); setTimeout(connectSSE, 5000); };
    }

    loadSettings();
    setInterval(updateClock, 30000);
    requestAnimationFrame(animate);
    connectSSE();
  </script>
</body>
</html>
