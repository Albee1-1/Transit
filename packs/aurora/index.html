<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020810; overflow: hidden; height: 100vh; user-select: none; }
    canvas { display: block; }

    .clock-overlay {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      text-align: center; pointer-events: none; z-index: 10; transition: opacity 0.5s;
    }
    .clock-overlay.hidden { opacity: 0; }
    .clock-overlay .time {
      font-family: 'Inter', sans-serif; font-size: 8vw; font-weight: 100;
      color: rgba(255,255,255,0.08); letter-spacing: 0.05em;
    }

    .settings-btn {
      position: fixed; top: 16px; right: 16px;
      background: none; border: none; color: #1a2a3a;
      font-size: 22px; cursor: pointer; opacity: 0;
      transition: opacity 0.3s; z-index: 100;
    }
    body:hover .settings-btn { opacity: 1; }
    .settings-panel {
      position: fixed; top: 60px; right: 16px;
      background: rgba(4,10,20,0.95); border: 1px solid #1a3a5a;
      border-radius: 12px; padding: 20px; display: none;
      z-index: 100; min-width: 220px; backdrop-filter: blur(20px);
    }
    .settings-panel.open { display: block; }
    .settings-panel h3 {
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400;
      color: #2a6a5a; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px;
    }
    .settings-panel label {
      display: flex; align-items: center; gap: 10px;
      color: #66ccaa; font-family: 'Inter', sans-serif; font-size: 13px;
      cursor: pointer; padding: 6px 0;
    }
    .settings-panel select {
      background: #060e18; color: #66ccaa; border: 1px solid #1a3a5a;
      border-radius: 6px; padding: 6px 10px; font-size: 13px;
      font-family: 'Inter', sans-serif; width: 100%; margin-top: 4px;
    }
    .settings-panel input[type="checkbox"] { accent-color: #00d4aa; width: 16px; height: 16px; }
    .setting-group { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #0e1e30; }
    .setting-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .reload-indicator {
      position: fixed; bottom: 8px; left: 8px;
      width: 5px; height: 5px; border-radius: 50%; background: #0a0a15; z-index: 20;
    }
    .reload-indicator.connected { background: #00d4aa; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="clock-overlay hidden" id="clockOverlay">
    <div class="time" id="clockTime"></div>
  </div>

  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-group">
      <h3>Aurora Style</h3>
      <label>
        <select id="style" onchange="saveSettings()">
          <option value="green">Green Curtain</option>
          <option value="rainbow">Full Spectrum</option>
          <option value="purple">Purple Haze</option>
          <option value="fire">Solar Flare</option>
        </select>
      </label>
    </div>
    <div class="setting-group">
      <h3>Intensity</h3>
      <label>
        <select id="intensity" onchange="saveSettings()">
          <option value="subtle">Subtle</option>
          <option value="normal" selected>Normal</option>
          <option value="vivid">Vivid</option>
        </select>
      </label>
    </div>
    <div class="setting-group">
      <h3>Stars</h3>
      <label><input type="checkbox" id="showStars" checked onchange="saveSettings()" /> Show stars</label>
    </div>
    <div class="setting-group">
      <h3>Overlay</h3>
      <label><input type="checkbox" id="showClock" onchange="saveSettings()" /> Show clock</label>
    </div>
  </div>

  <div class="reload-indicator" id="sseIndicator"></div>

  <script>
    const PACK_ID = 'aurora';
    const C = document.getElementById('canvas');
    const ctx = C.getContext('2d');
    let W, H;

    let style = 'green';
    let intensity = 'normal';
    let showStars = true;
    let showClock = false;

    const STYLES = {
      green:   [{ h: 120, s: 80, l: 50 }, { h: 160, s: 70, l: 40 }, { h: 100, s: 60, l: 45 }],
      rainbow: [{ h: 120, s: 80, l: 50 }, { h: 200, s: 80, l: 50 }, { h: 280, s: 70, l: 50 }, { h: 60, s: 80, l: 50 }],
      purple:  [{ h: 270, s: 70, l: 50 }, { h: 300, s: 60, l: 45 }, { h: 240, s: 80, l: 50 }],
      fire:    [{ h: 20, s: 90, l: 50 }, { h: 40, s: 80, l: 55 }, { h: 0, s: 85, l: 45 }],
    };

    const INTENSITY_MAP = { subtle: 0.4, normal: 0.7, vivid: 1.0 };

    let stars = [];
    let bands = [];

    function resize() {
      W = C.width = window.innerWidth;
      H = C.height = window.innerHeight;
      initStars();
      initBands();
    }
    window.addEventListener('resize', resize);

    function initStars() {
      stars = [];
      if (!showStars) return;
      for (let i = 0; i < 200; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H * 0.7,
          r: Math.random() * 1.5,
          twinkle: Math.random() * Math.PI * 2,
          speed: 0.5 + Math.random() * 2,
        });
      }
    }

    function initBands() {
      const colors = STYLES[style] || STYLES.green;
      bands = [];
      for (let i = 0; i < 5; i++) {
        const c = colors[i % colors.length];
        bands.push({
          y: H * 0.15 + Math.random() * H * 0.3,
          amplitude: H * 0.05 + Math.random() * H * 0.1,
          wavelength: 0.003 + Math.random() * 0.004,
          speed: 0.2 + Math.random() * 0.3,
          phase: Math.random() * Math.PI * 2,
          width: H * 0.08 + Math.random() * H * 0.15,
          hue: c.h,
          sat: c.s,
          light: c.l,
          drift: Math.random() * 0.1,
        });
      }
    }

    function drawStars(t) {
      for (const s of stars) {
        const twinkle = 0.3 + Math.sin(t * s.speed + s.twinkle) * 0.35 + 0.35;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${twinkle})`;
        ctx.fill();
      }
    }

    function drawAurora(t) {
      const alpha = INTENSITY_MAP[intensity] || 0.7;

      for (const band of bands) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';

        for (let layer = 0; layer < 3; layer++) {
          ctx.beginPath();
          const layerOffset = layer * 15;
          const layerAlpha = alpha * (0.08 - layer * 0.02);

          for (let x = 0; x <= W; x += 3) {
            const wave1 = Math.sin(x * band.wavelength + t * band.speed + band.phase) * band.amplitude;
            const wave2 = Math.sin(x * band.wavelength * 0.5 + t * band.speed * 0.7 + band.phase + 2) * band.amplitude * 0.5;
            const wave3 = Math.sin(x * band.wavelength * 2 + t * band.speed * 1.3) * band.amplitude * 0.2;
            const y = band.y + wave1 + wave2 + wave3 + layerOffset;

            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }

          // Close the shape downward
          for (let x = W; x >= 0; x -= 3) {
            const wave1 = Math.sin(x * band.wavelength + t * band.speed + band.phase) * band.amplitude;
            const wave2 = Math.sin(x * band.wavelength * 0.5 + t * band.speed * 0.7 + band.phase + 2) * band.amplitude * 0.5;
            const y = band.y + wave1 + wave2 + band.width + layerOffset;
            ctx.lineTo(x, y);
          }

          ctx.closePath();

          const hueShift = Math.sin(t * band.drift) * 20;
          const grad = ctx.createLinearGradient(0, band.y - band.amplitude, 0, band.y + band.width + band.amplitude);
          grad.addColorStop(0, `hsla(${band.hue + hueShift}, ${band.sat}%, ${band.light}%, 0)`);
          grad.addColorStop(0.3, `hsla(${band.hue + hueShift}, ${band.sat}%, ${band.light}%, ${layerAlpha})`);
          grad.addColorStop(0.5, `hsla(${band.hue + hueShift + 10}, ${band.sat}%, ${band.light + 10}%, ${layerAlpha * 1.2})`);
          grad.addColorStop(0.7, `hsla(${band.hue + hueShift}, ${band.sat}%, ${band.light}%, ${layerAlpha * 0.8})`);
          grad.addColorStop(1, `hsla(${band.hue + hueShift}, ${band.sat}%, ${band.light}%, 0)`);

          ctx.fillStyle = grad;
          ctx.fill();
        }

        ctx.restore();
      }
    }

    function drawGround() {
      const grad = ctx.createLinearGradient(0, H * 0.8, 0, H);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(0.3, '#060e18');
      grad.addColorStop(1, '#040a12');
      ctx.fillStyle = grad;
      ctx.fillRect(0, H * 0.8, W, H * 0.2);

      // Silhouette treeline
      ctx.fillStyle = '#030810';
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 8) {
        const treeH = H * 0.85 + Math.sin(x * 0.015) * 15 + Math.sin(x * 0.04) * 8 + Math.sin(x * 0.1) * 3;
        ctx.lineTo(x, treeH);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }

    let lastTime = 0;
    function animate(ts) {
      const t = ts * 0.001;
      lastTime = ts;

      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#010208');
      skyGrad.addColorStop(0.5, '#020810');
      skyGrad.addColorStop(1, '#040c18');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      if (showStars) drawStars(t);
      drawAurora(t);
      drawGround();

      requestAnimationFrame(animate);
    }

    function updateClock() {
      const el = document.getElementById('clockOverlay');
      el.className = showClock ? 'clock-overlay' : 'clock-overlay hidden';
      if (!showClock) return;
      const now = new Date();
      const h = String(now.getHours() % 12 || 12).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockTime').textContent = `${h}:${m}`;
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/config/' + PACK_ID);
        const cfg = await res.json();
        if (cfg.style) style = cfg.style;
        if (cfg.intensity) intensity = cfg.intensity;
        if (cfg.showStars !== undefined) showStars = cfg.showStars;
        if (cfg.showClock !== undefined) showClock = cfg.showClock;
        document.getElementById('style').value = style;
        document.getElementById('intensity').value = intensity;
        document.getElementById('showStars').checked = showStars;
        document.getElementById('showClock').checked = showClock;
      } catch {}
      resize();
      updateClock();
    }

    async function saveSettings() {
      style = document.getElementById('style').value;
      intensity = document.getElementById('intensity').value;
      showStars = document.getElementById('showStars').checked;
      showClock = document.getElementById('showClock').checked;
      resize();
      updateClock();
      try {
        await fetch('/api/config/' + PACK_ID, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ style, intensity, showStars, showClock }),
        });
      } catch {}
    }

    function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
    document.addEventListener('click', (e) => {
      const p = document.getElementById('settingsPanel');
      if (!p.contains(e.target) && !e.target.closest('.settings-btn')) p.classList.remove('open');
    });

    function connectSSE() {
      const ind = document.getElementById('sseIndicator');
      const es = new EventSource('/api/events');
      es.onopen = () => ind.classList.add('connected');
      es.addEventListener('packChanged', (e) => {
        const d = JSON.parse(e.data);
        if (d.activePackId !== PACK_ID) window.location.href = '/';
      });
      es.onerror = () => { ind.classList.remove('connected'); es.close(); setTimeout(connectSSE, 5000); };
    }

    loadSettings();
    setInterval(updateClock, 30000);
    requestAnimationFrame(animate);
    connectSSE();
  </script>
</body>
</html>
