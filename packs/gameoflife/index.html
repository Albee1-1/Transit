<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game of Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #040804; overflow: hidden; height: 100vh; user-select: none; }
    canvas { display: block; image-rendering: pixelated; }
    .stats-overlay {
      position: fixed; top: 20px; left: 20px;
      font-family: 'Inter', sans-serif; z-index: 10; transition: opacity 0.5s;
    }
    .stats-overlay .gen { font-size: 11px; color: rgba(102,187,106,0.3); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
    .stats-overlay .num { font-size: 32px; font-weight: 100; color: rgba(102,187,106,0.15); }
    .settings-btn { position: fixed; top: 16px; right: 16px; background: none; border: none; color: #0a2a0a; font-size: 22px; cursor: pointer; opacity: 0; transition: opacity 0.3s; z-index: 100; }
    body:hover .settings-btn { opacity: 1; }
    .settings-panel { position: fixed; top: 60px; right: 16px; background: rgba(6,12,6,0.95); border: 1px solid #1a3a1a; border-radius: 12px; padding: 20px; display: none; z-index: 100; min-width: 220px; backdrop-filter: blur(20px); }
    .settings-panel.open { display: block; }
    .settings-panel h3 { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; color: #2a6a2a; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    .settings-panel label { display: flex; align-items: center; gap: 10px; color: #5aaa5a; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; padding: 6px 0; }
    .settings-panel select { background: #060c06; color: #5aaa5a; border: 1px solid #1a3a1a; border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: 'Inter', sans-serif; width: 100%; margin-top: 4px; }
    .settings-panel button.action-btn { width: 100%; padding: 8px; margin-top: 8px; border-radius: 6px; background: rgba(102,187,106,0.15); color: #66bb6a; border: 1px solid rgba(102,187,106,0.2); font-size: 13px; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s; }
    .settings-panel button.action-btn:hover { background: rgba(102,187,106,0.25); }
    .settings-panel input[type="checkbox"] { accent-color: #66bb6a; width: 16px; height: 16px; }
    .setting-group { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #0c1a0c; }
    .setting-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .reload-indicator { position: fixed; bottom: 8px; left: 8px; width: 5px; height: 5px; border-radius: 50%; background: #060c06; z-index: 20; }
    .reload-indicator.connected { background: #66bb6a; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="stats-overlay" id="statsOverlay">
    <div class="gen">Generation</div>
    <div class="num" id="genNum">0</div>
  </div>
  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-group">
      <h3>Color</h3>
      <label><select id="colorMode" onchange="saveSettings()">
        <option value="green">Matrix Green</option>
        <option value="blue">Electric Blue</option>
        <option value="rainbow">Rainbow Age</option>
        <option value="white">Minimal White</option>
      </select></label>
    </div>
    <div class="setting-group">
      <h3>Speed</h3>
      <label><select id="speed" onchange="saveSettings()">
        <option value="slow">Slow</option>
        <option value="normal" selected>Normal</option>
        <option value="fast">Fast</option>
      </select></label>
    </div>
    <div class="setting-group">
      <h3>Display</h3>
      <label><input type="checkbox" id="showStats" checked onchange="saveSettings()" /> Show generation</label>
    </div>
    <div class="setting-group">
      <h3>Actions</h3>
      <button class="action-btn" onclick="randomize()">Randomize</button>
    </div>
  </div>
  <div class="reload-indicator" id="sseIndicator"></div>

  <script>
    const PACK_ID = 'gameoflife';
    const C = document.getElementById('canvas');
    const ctx = C.getContext('2d');

    let colorMode = 'green';
    let speed = 'normal';
    let showStats = true;

    const CELL_SIZE = 6;
    const SPEED_MAP = { slow: 200, normal: 80, fast: 30 };

    let cols, rows, grid, ages;
    let generation = 0;
    let lastStep = 0;

    function resize() {
      C.width = window.innerWidth;
      C.height = window.innerHeight;
      cols = Math.ceil(C.width / CELL_SIZE);
      rows = Math.ceil(C.height / CELL_SIZE);
      randomize();
    }
    window.addEventListener('resize', resize);

    function randomize() {
      grid = new Uint8Array(cols * rows);
      ages = new Uint16Array(cols * rows);
      generation = 0;
      for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.random() < 0.3 ? 1 : 0;
      }
    }

    resize();

    function step() {
      const next = new Uint8Array(cols * rows);
      const nextAges = new Uint16Array(cols * rows);

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          let neighbors = 0;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (dx === 0 && dy === 0) continue;
              const nx = (x + dx + cols) % cols;
              const ny = (y + dy + rows) % rows;
              neighbors += grid[ny * cols + nx];
            }
          }
          const idx = y * cols + x;
          const alive = grid[idx];
          if (alive && (neighbors === 2 || neighbors === 3)) {
            next[idx] = 1;
            nextAges[idx] = ages[idx] + 1;
          } else if (!alive && neighbors === 3) {
            next[idx] = 1;
            nextAges[idx] = 0;
          }
        }
      }

      // Auto-reset if stagnant (very few alive cells)
      let aliveCount = 0;
      for (let i = 0; i < next.length; i++) aliveCount += next[i];
      if (aliveCount < cols * rows * 0.01) {
        randomize();
        return;
      }

      grid = next;
      ages = nextAges;
      generation++;
    }

    function getCellColor(age) {
      switch (colorMode) {
        case 'blue': {
          const a = Math.min(age, 50) / 50;
          return `rgb(${20 + a * 30}, ${80 + a * 100}, ${200 + a * 55})`;
        }
        case 'rainbow': {
          const hue = (age * 3) % 360;
          return `hsl(${hue}, 80%, 50%)`;
        }
        case 'white': {
          const a = Math.min(age, 30) / 30;
          const v = 100 + a * 155;
          return `rgb(${v},${v},${v})`;
        }
        default: { // green
          const a = Math.min(age, 40) / 40;
          return `rgb(${10 + a * 30}, ${120 + a * 135}, ${30 + a * 40})`;
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#040804';
      ctx.fillRect(0, 0, C.width, C.height);

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const idx = y * cols + x;
          if (grid[idx]) {
            ctx.fillStyle = getCellColor(ages[idx]);
            ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
          }
        }
      }
    }

    function animate(ts) {
      const interval = SPEED_MAP[speed] || 80;
      if (ts - lastStep > interval) {
        step();
        lastStep = ts;
      }
      draw();

      document.getElementById('statsOverlay').style.display = showStats ? 'block' : 'none';
      document.getElementById('genNum').textContent = generation.toLocaleString();

      requestAnimationFrame(animate);
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/config/' + PACK_ID);
        const cfg = await res.json();
        if (cfg.colorMode) colorMode = cfg.colorMode;
        if (cfg.speed) speed = cfg.speed;
        if (cfg.showStats !== undefined) showStats = cfg.showStats;
        document.getElementById('colorMode').value = colorMode;
        document.getElementById('speed').value = speed;
        document.getElementById('showStats').checked = showStats;
      } catch {}
    }
    async function saveSettings() {
      colorMode = document.getElementById('colorMode').value;
      speed = document.getElementById('speed').value;
      showStats = document.getElementById('showStats').checked;
      try { await fetch('/api/config/' + PACK_ID, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ colorMode, speed, showStats }) }); } catch {}
    }
    function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
    document.addEventListener('click', (e) => { const p = document.getElementById('settingsPanel'); if (!p.contains(e.target) && !e.target.closest('.settings-btn')) p.classList.remove('open'); });
    function connectSSE() {
      const ind = document.getElementById('sseIndicator'); const es = new EventSource('/api/events');
      es.onopen = () => ind.classList.add('connected');
      es.addEventListener('packChanged', (e) => { const d = JSON.parse(e.data); if (d.activePackId !== PACK_ID) window.location.href = '/'; });
      es.onerror = () => { ind.classList.remove('connected'); es.close(); setTimeout(connectSSE, 5000); };
    }
    loadSettings(); requestAnimationFrame(animate); connectSSE();
  </script>
</body>
</html>
