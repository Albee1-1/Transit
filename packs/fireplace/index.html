<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fireplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0400; overflow: hidden; height: 100vh; user-select: none; }
    canvas { display: block; }

    .clock-overlay {
      position: fixed; top: 30px; right: 30px;
      font-family: 'Inter', sans-serif; font-size: 48px; font-weight: 100;
      color: rgba(255,200,150,0.1); letter-spacing: 0.05em;
      z-index: 10; display: none;
    }

    .settings-btn {
      position: fixed; top: 16px; right: 16px;
      background: none; border: none; color: #2a1a0a;
      font-size: 22px; cursor: pointer; opacity: 0;
      transition: opacity 0.3s; z-index: 100;
    }
    body:hover .settings-btn { opacity: 1; }
    .settings-panel {
      position: fixed; top: 60px; right: 16px;
      background: rgba(15,8,2,0.95); border: 1px solid #3a2a1a;
      border-radius: 12px; padding: 20px; display: none;
      z-index: 100; min-width: 220px; backdrop-filter: blur(20px);
    }
    .settings-panel.open { display: block; }
    .settings-panel h3 {
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400;
      color: #8a5a2a; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px;
    }
    .settings-panel label {
      display: flex; align-items: center; gap: 10px;
      color: #cc8844; font-family: 'Inter', sans-serif; font-size: 13px;
      cursor: pointer; padding: 6px 0;
    }
    .settings-panel select {
      background: #120a04; color: #cc8844; border: 1px solid #3a2a1a;
      border-radius: 6px; padding: 6px 10px; font-size: 13px;
      font-family: 'Inter', sans-serif; width: 100%; margin-top: 4px;
    }
    .settings-panel input[type="checkbox"] { accent-color: #ff6b35; width: 16px; height: 16px; }
    .setting-group { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #1a1008; }
    .setting-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .reload-indicator {
      position: fixed; bottom: 8px; left: 8px;
      width: 5px; height: 5px; border-radius: 50%; background: #0a0a05; z-index: 20;
    }
    .reload-indicator.connected { background: #ff6b35; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="clock-overlay" id="clock"></div>

  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-group">
      <h3>Flame Size</h3>
      <label>
        <select id="flameSize" onchange="saveSettings()">
          <option value="embers">Embers</option>
          <option value="medium" selected>Medium</option>
          <option value="roaring">Roaring</option>
        </select>
      </label>
    </div>
    <div class="setting-group">
      <h3>Display</h3>
      <label><input type="checkbox" id="showClock" onchange="saveSettings()" /> Show clock</label>
      <label><input type="checkbox" id="showEmbers" checked onchange="saveSettings()" /> Flying embers</label>
    </div>
  </div>

  <div class="reload-indicator" id="sseIndicator"></div>

  <script>
    const PACK_ID = 'fireplace';
    const C = document.getElementById('canvas');
    const ctx = C.getContext('2d');
    let W, H;

    let flameSize = 'medium';
    let showClock = false;
    let showEmbers = true;

    const SIZE_MAP = { embers: 0.5, medium: 1.0, roaring: 1.5 };

    let particles = [];
    let embers = [];
    let logs = [];

    function resize() {
      W = C.width = window.innerWidth;
      H = C.height = window.innerHeight;
      initLogs();
    }
    window.addEventListener('resize', resize);

    function initLogs() {
      const baseY = H * 0.75;
      logs = [
        { x: W * 0.35, y: baseY, w: W * 0.35, h: 30, angle: -0.08, color: '#3a2010' },
        { x: W * 0.32, y: baseY - 20, w: W * 0.38, h: 25, angle: 0.05, color: '#2d1a0c' },
        { x: W * 0.4, y: baseY - 35, w: W * 0.22, h: 20, angle: -0.12, color: '#351c0e' },
      ];
    }

    function createFlameParticle() {
      const scale = SIZE_MAP[flameSize] || 1;
      const spreadX = W * 0.15 * scale;
      return {
        x: W * 0.5 + (Math.random() - 0.5) * spreadX,
        y: H * 0.72,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -(3 + Math.random() * 4) * scale,
        life: 1.0,
        decay: 0.008 + Math.random() * 0.012,
        size: (15 + Math.random() * 25) * scale,
        turbulence: Math.random() * Math.PI * 2,
      };
    }

    function createEmber() {
      const scale = SIZE_MAP[flameSize] || 1;
      return {
        x: W * 0.5 + (Math.random() - 0.5) * W * 0.2,
        y: H * 0.65,
        vx: (Math.random() - 0.5) * 2,
        vy: -(1 + Math.random() * 3) * scale,
        life: 1.0,
        decay: 0.003 + Math.random() * 0.005,
        size: 1 + Math.random() * 3,
        phase: Math.random() * Math.PI * 2,
      };
    }

    function drawBackground() {
      // Room ambient
      const grad = ctx.createRadialGradient(W * 0.5, H * 0.7, 0, W * 0.5, H * 0.7, H * 0.8);
      const scale = SIZE_MAP[flameSize] || 1;
      grad.addColorStop(0, `rgba(40, 18, 5, ${0.3 * scale})`);
      grad.addColorStop(0.5, `rgba(15, 6, 2, ${0.15 * scale})`);
      grad.addColorStop(1, '#0a0400');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }

    function drawLogs() {
      for (const log of logs) {
        ctx.save();
        ctx.translate(log.x + log.w / 2, log.y);
        ctx.rotate(log.angle);

        // Log body
        ctx.beginPath();
        ctx.roundRect(-log.w / 2, -log.h / 2, log.w, log.h, 8);
        const grad = ctx.createLinearGradient(0, -log.h / 2, 0, log.h / 2);
        grad.addColorStop(0, log.color);
        grad.addColorStop(0.5, '#1a0c05');
        grad.addColorStop(1, log.color);
        ctx.fillStyle = grad;
        ctx.fill();

        // Bark texture lines
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 5; i++) {
          const lx = -log.w / 2 + Math.random() * log.w;
          ctx.beginPath();
          ctx.moveTo(lx, -log.h / 2);
          ctx.lineTo(lx + (Math.random() - 0.5) * 10, log.h / 2);
          ctx.stroke();
        }

        // Glow on top of logs
        ctx.beginPath();
        ctx.roundRect(-log.w / 2, -log.h / 2, log.w, log.h / 2, [8, 8, 0, 0]);
        ctx.fillStyle = 'rgba(255,80,0,0.04)';
        ctx.fill();

        ctx.restore();
      }

      // Hearth / base
      ctx.fillStyle = '#1a0e08';
      ctx.fillRect(W * 0.2, H * 0.78, W * 0.6, H * 0.22);
      const hearthGrad = ctx.createLinearGradient(0, H * 0.78, 0, H);
      hearthGrad.addColorStop(0, 'rgba(50,25,10,0.6)');
      hearthGrad.addColorStop(1, '#0a0400');
      ctx.fillStyle = hearthGrad;
      ctx.fillRect(W * 0.2, H * 0.78, W * 0.6, H * 0.22);
    }

    function drawFlames(t) {
      // Add new particles
      const scale = SIZE_MAP[flameSize] || 1;
      const spawnRate = Math.floor(8 * scale);
      for (let i = 0; i < spawnRate; i++) {
        particles.push(createFlameParticle());
      }
      if (showEmbers && Math.random() < 0.15 * scale) {
        embers.push(createEmber());
      }

      // Draw flame particles (additive blending)
      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        // Turbulence
        p.vx += Math.sin(t * 3 + p.turbulence) * 0.15;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        p.vy *= 0.99;

        if (p.life <= 0) { particles.splice(i, 1); continue; }

        const size = p.size * p.life;
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size);

        if (p.life > 0.7) {
          // Core: white-yellow
          grad.addColorStop(0, `rgba(255, 250, 220, ${p.life * 0.6})`);
          grad.addColorStop(0.3, `rgba(255, 180, 50, ${p.life * 0.4})`);
          grad.addColorStop(1, `rgba(255, 80, 0, 0)`);
        } else if (p.life > 0.3) {
          // Mid: orange
          grad.addColorStop(0, `rgba(255, 140, 30, ${p.life * 0.5})`);
          grad.addColorStop(0.5, `rgba(200, 60, 10, ${p.life * 0.3})`);
          grad.addColorStop(1, 'rgba(150, 30, 0, 0)');
        } else {
          // Smoke
          grad.addColorStop(0, `rgba(80, 40, 20, ${p.life * 0.4})`);
          grad.addColorStop(1, 'rgba(40, 20, 10, 0)');
        }

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Embers
      for (let i = embers.length - 1; i >= 0; i--) {
        const e = embers[i];
        e.x += e.vx + Math.sin(t * 2 + e.phase) * 0.5;
        e.y += e.vy;
        e.vy -= 0.01; // float up
        e.vx *= 0.999;
        e.life -= e.decay;

        if (e.life <= 0) { embers.splice(i, 1); continue; }

        const flicker = 0.5 + Math.sin(t * 10 + e.phase) * 0.5;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size * e.life, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, ${100 + flicker * 100}, 0, ${e.life * flicker})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff6600';
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      ctx.restore();

      // Ambient glow on floor
      const floorGlow = ctx.createRadialGradient(W * 0.5, H * 0.75, 0, W * 0.5, H * 0.75, W * 0.4 * scale);
      floorGlow.addColorStop(0, `rgba(255, 100, 20, ${0.05 * scale})`);
      floorGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = floorGlow;
      ctx.fillRect(0, H * 0.5, W, H * 0.5);
    }

    let lastTime = 0;
    function animate(ts) {
      const t = ts * 0.001;
      lastTime = ts;

      drawBackground();
      drawLogs();
      drawFlames(t);

      requestAnimationFrame(animate);
    }

    function updateClock() {
      const el = document.getElementById('clock');
      if (!showClock) { el.style.display = 'none'; return; }
      el.style.display = 'block';
      const now = new Date();
      const h = now.getHours() % 12 || 12;
      const m = String(now.getMinutes()).padStart(2, '0');
      el.textContent = `${h}:${m}`;
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/config/' + PACK_ID);
        const cfg = await res.json();
        if (cfg.flameSize) flameSize = cfg.flameSize;
        if (cfg.showClock !== undefined) showClock = cfg.showClock;
        if (cfg.showEmbers !== undefined) showEmbers = cfg.showEmbers;
        document.getElementById('flameSize').value = flameSize;
        document.getElementById('showClock').checked = showClock;
        document.getElementById('showEmbers').checked = showEmbers;
      } catch {}
      resize();
      updateClock();
    }

    async function saveSettings() {
      flameSize = document.getElementById('flameSize').value;
      showClock = document.getElementById('showClock').checked;
      showEmbers = document.getElementById('showEmbers').checked;
      updateClock();
      try {
        await fetch('/api/config/' + PACK_ID, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ flameSize, showClock, showEmbers }),
        });
      } catch {}
    }

    function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
    document.addEventListener('click', (e) => {
      const p = document.getElementById('settingsPanel');
      if (!p.contains(e.target) && !e.target.closest('.settings-btn')) p.classList.remove('open');
    });

    function connectSSE() {
      const ind = document.getElementById('sseIndicator');
      const es = new EventSource('/api/events');
      es.onopen = () => ind.classList.add('connected');
      es.addEventListener('packChanged', (e) => {
        const d = JSON.parse(e.data);
        if (d.activePackId !== PACK_ID) window.location.href = '/';
      });
      es.onerror = () => { ind.classList.remove('connected'); es.close(); setTimeout(connectSSE, 5000); };
    }

    loadSettings();
    setInterval(updateClock, 30000);
    requestAnimationFrame(animate);
    connectSSE();
  </script>
</body>
</html>
