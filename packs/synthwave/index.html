<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synthwave</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0010; overflow: hidden; height: 100vh; user-select: none; }
    canvas { display: block; }
    .clock-overlay {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -60%);
      text-align: center; pointer-events: none; z-index: 10; transition: opacity 0.5s;
    }
    .clock-overlay.hidden { opacity: 0; }
    .clock-overlay .time { font-family: 'Inter', sans-serif; font-size: 14vw; font-weight: 100; color: rgba(255,110,199,0.1); letter-spacing: 0.08em; text-shadow: 0 0 40px rgba(255,110,199,0.05); }
    .settings-btn { position: fixed; top: 16px; right: 16px; background: none; border: none; color: #2a0a2a; font-size: 22px; cursor: pointer; opacity: 0; transition: opacity 0.3s; z-index: 100; }
    body:hover .settings-btn { opacity: 1; }
    .settings-panel { position: fixed; top: 60px; right: 16px; background: rgba(10,0,16,0.95); border: 1px solid #3a1a4a; border-radius: 12px; padding: 20px; display: none; z-index: 100; min-width: 220px; backdrop-filter: blur(20px); }
    .settings-panel.open { display: block; }
    .settings-panel h3 { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; color: #8a3a6a; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    .settings-panel label { display: flex; align-items: center; gap: 10px; color: #cc66aa; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; padding: 6px 0; }
    .settings-panel select { background: #0a0014; color: #cc66aa; border: 1px solid #3a1a4a; border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: 'Inter', sans-serif; width: 100%; margin-top: 4px; }
    .settings-panel input[type="checkbox"] { accent-color: #ff6ec7; width: 16px; height: 16px; }
    .setting-group { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #1a0a2a; }
    .setting-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .reload-indicator { position: fixed; bottom: 8px; left: 8px; width: 5px; height: 5px; border-radius: 50%; background: #0a0014; z-index: 20; }
    .reload-indicator.connected { background: #ff6ec7; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="clock-overlay hidden" id="clockOverlay"><div class="time" id="clockTime"></div></div>
  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-group">
      <h3>Grid Speed</h3>
      <label><select id="speed" onchange="saveSettings()">
        <option value="slow">Slow</option>
        <option value="normal" selected>Normal</option>
        <option value="fast">Fast</option>
      </select></label>
    </div>
    <div class="setting-group">
      <h3>Display</h3>
      <label><input type="checkbox" id="showSun" checked onchange="saveSettings()" /> Show sun</label>
      <label><input type="checkbox" id="showClock" onchange="saveSettings()" /> Show clock</label>
    </div>
  </div>
  <div class="reload-indicator" id="sseIndicator"></div>

  <script>
    const PACK_ID = 'synthwave';
    const C = document.getElementById('canvas');
    const ctx = C.getContext('2d');
    let W, H;

    let speed = 'normal';
    let showSun = true;
    let showClock = false;
    const SPEED_MAP = { slow: 0.3, normal: 0.7, fast: 1.5 };

    function resize() { W = C.width = window.innerWidth; H = C.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    function drawSky() {
      const grad = ctx.createLinearGradient(0, 0, 0, H * 0.55);
      grad.addColorStop(0, '#0a0020');
      grad.addColorStop(0.3, '#1a0040');
      grad.addColorStop(0.6, '#4a0060');
      grad.addColorStop(0.85, '#ff006680');
      grad.addColorStop(1, '#ff6ec7');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H * 0.55);
    }

    function drawSunObj(t) {
      if (!showSun) return;
      const sx = W / 2;
      const sy = H * 0.42;
      const r = Math.min(W, H) * 0.12;

      // Sun glow
      const glow = ctx.createRadialGradient(sx, sy, r * 0.8, sx, sy, r * 3);
      glow.addColorStop(0, 'rgba(255,110,199,0.15)');
      glow.addColorStop(0.5, 'rgba(255,60,100,0.05)');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H * 0.55);

      // Sun body with horizontal stripes
      ctx.save();
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.clip();

      const sunGrad = ctx.createLinearGradient(sx, sy - r, sx, sy + r);
      sunGrad.addColorStop(0, '#ffea00');
      sunGrad.addColorStop(0.5, '#ff6d00');
      sunGrad.addColorStop(1, '#ff1744');
      ctx.fillStyle = sunGrad;
      ctx.fillRect(sx - r, sy - r, r * 2, r * 2);

      // Horizontal line cutouts
      ctx.fillStyle = '#0a0020';
      const lines = 8;
      for (let i = 0; i < lines; i++) {
        const ly = sy + r * 0.1 + (i / lines) * r * 0.9;
        const lh = 2 + i * 0.8;
        ctx.fillRect(sx - r, ly, r * 2, lh);
      }
      ctx.restore();
    }

    function drawGrid(t) {
      const horizon = H * 0.55;
      const spd = SPEED_MAP[speed] || 0.7;

      // Ground
      const groundGrad = ctx.createLinearGradient(0, horizon, 0, H);
      groundGrad.addColorStop(0, '#1a0030');
      groundGrad.addColorStop(1, '#0a0010');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, horizon, W, H - horizon);

      // Perspective grid - horizontal lines
      ctx.strokeStyle = 'rgba(255,110,199,0.25)';
      ctx.lineWidth = 1;
      const gridRows = 30;
      const offset = (t * spd * 50) % (H * 0.15);

      for (let i = 0; i < gridRows; i++) {
        const f = i / gridRows + offset / (H * 0.5);
        if (f > 1) continue;
        const perspY = horizon + Math.pow(f, 1.8) * (H - horizon);
        const alpha = 0.05 + f * 0.25;
        ctx.strokeStyle = `rgba(255,110,199,${alpha})`;
        ctx.beginPath();
        ctx.moveTo(0, perspY);
        ctx.lineTo(W, perspY);
        ctx.stroke();
      }

      // Vertical lines
      const gridCols = 20;
      for (let i = -gridCols; i <= gridCols; i++) {
        const xBase = W / 2 + (i / gridCols) * W * 2;
        const alpha = 0.08 + Math.abs(i / gridCols) * 0.15;
        ctx.strokeStyle = `rgba(120,40,255,${Math.min(0.3, alpha)})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(W / 2 + (i / gridCols) * W * 0.1, horizon);
        ctx.lineTo(xBase, H);
        ctx.stroke();
      }

      // Horizon glow line
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff6ec7';
      ctx.strokeStyle = '#ff6ec7';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, horizon);
      ctx.lineTo(W, horizon);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawStars() {
      for (let i = 0; i < 80; i++) {
        const x = (i * 73.7) % W;
        const y = (i * 37.3) % (H * 0.35);
        ctx.beginPath();
        ctx.arc(x, y, 0.5 + Math.random() * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${0.2 + Math.random() * 0.3})`;
        ctx.fill();
      }
    }

    function animate(ts) {
      const t = ts * 0.001;
      ctx.fillStyle = '#0a0010';
      ctx.fillRect(0, 0, W, H);

      drawSky();
      drawStars();
      drawSunObj(t);
      drawGrid(t);

      requestAnimationFrame(animate);
    }

    function updateClock() {
      const el = document.getElementById('clockOverlay');
      el.className = showClock ? 'clock-overlay' : 'clock-overlay hidden';
      if (!showClock) return;
      const now = new Date();
      document.getElementById('clockTime').textContent = `${String(now.getHours() % 12 || 12).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/config/' + PACK_ID);
        const cfg = await res.json();
        if (cfg.speed) speed = cfg.speed;
        if (cfg.showSun !== undefined) showSun = cfg.showSun;
        if (cfg.showClock !== undefined) showClock = cfg.showClock;
        document.getElementById('speed').value = speed;
        document.getElementById('showSun').checked = showSun;
        document.getElementById('showClock').checked = showClock;
      } catch {}
      updateClock();
    }
    async function saveSettings() {
      speed = document.getElementById('speed').value;
      showSun = document.getElementById('showSun').checked;
      showClock = document.getElementById('showClock').checked;
      updateClock();
      try { await fetch('/api/config/' + PACK_ID, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ speed, showSun, showClock }) }); } catch {}
    }
    function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
    document.addEventListener('click', (e) => { const p = document.getElementById('settingsPanel'); if (!p.contains(e.target) && !e.target.closest('.settings-btn')) p.classList.remove('open'); });
    function connectSSE() { const ind = document.getElementById('sseIndicator'); const es = new EventSource('/api/events'); es.onopen = () => ind.classList.add('connected'); es.addEventListener('packChanged', (e) => { const d = JSON.parse(e.data); if (d.activePackId !== PACK_ID) window.location.href = '/'; }); es.onerror = () => { ind.classList.remove('connected'); es.close(); setTimeout(connectSSE, 5000); }; }
    loadSettings(); setInterval(updateClock, 30000); requestAnimationFrame(animate); connectSSE();
  </script>
</body>
</html>
