<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #04060e;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .settings-btn {
      position: fixed; top: 16px; right: 16px;
      background: none; border: none; color: #151515;
      font-size: 22px; cursor: pointer; opacity: 0;
      transition: opacity 0.3s; z-index: 100;
    }
    body:hover .settings-btn { opacity: 1; }
    .settings-panel {
      position: fixed; top: 60px; right: 16px;
      background: rgba(8,8,12,0.95); border: 1px solid #1a1a1a;
      border-radius: 12px; padding: 20px; display: none;
      z-index: 100; min-width: 220px; backdrop-filter: blur(20px);
    }
    .settings-panel.open { display: block; }
    .settings-panel h3 {
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400;
      color: #444; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px;
    }
    .settings-panel label {
      display: flex; align-items: center; gap: 10px;
      color: #777; font-family: 'Inter', sans-serif; font-size: 13px;
      cursor: pointer; padding: 6px 0;
    }
    .settings-panel select {
      background: #0a0a0a; color: #777; border: 1px solid #222;
      border-radius: 6px; padding: 6px 10px; font-size: 13px;
      font-family: 'Inter', sans-serif; width: 100%; margin-top: 4px;
    }
    .settings-panel input[type="checkbox"] { accent-color: #7e9cc9; }
    .setting-group { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #111; }
    .setting-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .reload-indicator {
      position: fixed; bottom: 8px; left: 8px;
      width: 5px; height: 5px; border-radius: 50%; background: #0a0a0a; z-index: 20;
    }
    .reload-indicator.connected { background: #4caf50; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-group">
      <h3>Star Density</h3>
      <label>
        <select id="starDensitySelect" onchange="saveSettings()">
          <option value="sparse">Sparse</option>
          <option value="normal" selected>Normal</option>
          <option value="dense">Dense</option>
        </select>
      </label>
    </div>
    <div class="setting-group">
      <h3>Nebula Intensity</h3>
      <label>
        <select id="nebulaIntensitySelect" onchange="saveSettings()">
          <option value="subtle">Subtle</option>
          <option value="medium" selected>Medium</option>
          <option value="vivid">Vivid</option>
        </select>
      </label>
    </div>
    <div class="setting-group">
      <h3>Speed</h3>
      <label>
        <select id="speedSelect" onchange="saveSettings()">
          <option value="slow" selected>Slow</option>
          <option value="medium">Medium</option>
          <option value="fast">Fast</option>
        </select>
      </label>
    </div>
    <div class="setting-group">
      <h3>Display</h3>
      <label><input type="checkbox" id="showPlanetCheck" checked onchange="saveSettings()" /> Show Planet</label>
    </div>
  </div>
  <div class="reload-indicator" id="sseIndicator"></div>

  <script>
    const PACK_ID = 'space';
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let starDensity = 'normal';
    let showPlanet = true;
    let nebulaIntensity = 'medium';
    let speed = 'slow';

    let W, H;
    let stars = [[], [], []];
    let nebulae = [];
    let shootingStar = null;
    let shootingTimer = 0;
    let time = 0;

    const densityMap = { sparse: 0.5, normal: 1, dense: 1.8 };
    const speedMap = { slow: 1, medium: 2, fast: 3.5 };
    const nebulaAlphaMap = { subtle: 0.04, medium: 0.08, vivid: 0.14 };

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      initStars();
      initNebulae();
    }

    function initStars() {
      const d = densityMap[starDensity] || 1;
      const counts = [Math.floor(200 * d), Math.floor(120 * d), Math.floor(60 * d)];
      const sizes = [[0.4, 1], [1, 2], [1.8, 3.2]];
      const alphas = [[0.2, 0.5], [0.4, 0.7], [0.6, 1]];
      for (let layer = 0; layer < 3; layer++) {
        stars[layer] = [];
        for (let i = 0; i < counts[layer]; i++) {
          stars[layer].push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: sizes[layer][0] + Math.random() * (sizes[layer][1] - sizes[layer][0]),
            a: alphas[layer][0] + Math.random() * (alphas[layer][1] - alphas[layer][0]),
            twinkle: Math.random() * Math.PI * 2,
            twinkleSpeed: 0.3 + Math.random() * 0.8,
          });
        }
      }
    }

    function initNebulae() {
      nebulae = [];
      const colors = [
        [80, 60, 180],
        [30, 100, 160],
        [140, 40, 100],
      ];
      for (let i = 0; i < 3; i++) {
        nebulae.push({
          x: W * (0.2 + Math.random() * 0.6),
          y: H * (0.2 + Math.random() * 0.6),
          radius: Math.min(W, H) * (0.25 + Math.random() * 0.2),
          color: colors[i],
          angle: Math.random() * Math.PI * 2,
          drift: 0.0002 + Math.random() * 0.0003,
          hueShift: 0,
        });
      }
    }

    function spawnShootingStar() {
      const side = Math.random();
      let sx, sy, angle;
      if (side < 0.5) {
        sx = Math.random() * W;
        sy = -10;
        angle = Math.PI * 0.2 + Math.random() * 0.3;
      } else {
        sx = -10;
        sy = Math.random() * H * 0.5;
        angle = Math.PI * 0.05 + Math.random() * 0.2;
      }
      shootingStar = {
        x: sx, y: sy, angle,
        speed: 8 + Math.random() * 6,
        length: 80 + Math.random() * 60,
        life: 1,
        decay: 0.015 + Math.random() * 0.01,
      };
    }

    function drawNebulae() {
      const alpha = nebulaAlphaMap[nebulaIntensity] || 0.08;
      for (const n of nebulae) {
        n.angle += n.drift * (speedMap[speed] || 1);
        n.hueShift += 0.05 * (speedMap[speed] || 1);
        const ox = Math.cos(n.angle) * 30;
        const oy = Math.sin(n.angle) * 20;
        const hShift = Math.sin(n.hueShift * 0.01) * 20;
        const r = Math.min(255, Math.max(0, n.color[0] + hShift));
        const g = Math.min(255, Math.max(0, n.color[1] + hShift * 0.5));
        const b = Math.min(255, Math.max(0, n.color[2] - hShift * 0.3));
        const grad = ctx.createRadialGradient(
          n.x + ox, n.y + oy, 0,
          n.x + ox, n.y + oy, n.radius
        );
        grad.addColorStop(0, `rgba(${r|0},${g|0},${b|0},${alpha})`);
        grad.addColorStop(0.5, `rgba(${r|0},${g|0},${b|0},${alpha * 0.4})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawStars() {
      const sp = speedMap[speed] || 1;
      const layerSpeeds = [0.05 * sp, 0.15 * sp, 0.35 * sp];
      const layerDriftX = [0.02 * sp, 0.06 * sp, 0.12 * sp];
      for (let layer = 0; layer < 3; layer++) {
        for (const s of stars[layer]) {
          s.y += layerSpeeds[layer];
          s.x += Math.sin(time * 0.0003 + s.twinkle) * layerDriftX[layer];
          if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; }
          if (s.x > W + 5) s.x = -5;
          if (s.x < -5) s.x = W + 5;
          s.twinkle += s.twinkleSpeed * 0.02;
          const flicker = 0.7 + 0.3 * Math.sin(s.twinkle);
          ctx.globalAlpha = s.a * flicker;
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawPlanet() {
      if (!showPlanet) return;
      const px = W * 0.78;
      const py = H * 0.35;
      const pr = Math.min(W, H) * 0.09;
      // Planet body
      const bodyGrad = ctx.createRadialGradient(px - pr * 0.3, py - pr * 0.3, pr * 0.1, px, py, pr);
      bodyGrad.addColorStop(0, '#c9a86c');
      bodyGrad.addColorStop(0.4, '#a07840');
      bodyGrad.addColorStop(0.8, '#6b4c2a');
      bodyGrad.addColorStop(1, '#2a1e12');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();
      // Atmosphere glow
      const glowGrad = ctx.createRadialGradient(px, py, pr * 0.9, px, py, pr * 1.3);
      glowGrad.addColorStop(0, 'rgba(180,140,80,0.08)');
      glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(px, py, pr * 1.3, 0, Math.PI * 2);
      ctx.fill();
      // Ring
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(-0.3);
      ctx.scale(1, 0.3);
      ctx.strokeStyle = 'rgba(200,180,140,0.25)';
      ctx.lineWidth = pr * 0.08;
      ctx.beginPath();
      ctx.arc(0, 0, pr * 1.6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(200,180,140,0.12)';
      ctx.lineWidth = pr * 0.05;
      ctx.beginPath();
      ctx.arc(0, 0, pr * 1.9, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawShootingStar() {
      if (!shootingStar) return;
      const s = shootingStar;
      s.x += Math.cos(s.angle) * s.speed;
      s.y += Math.sin(s.angle) * s.speed;
      s.life -= s.decay;
      if (s.life <= 0 || s.x > W + 100 || s.y > H + 100) {
        shootingStar = null;
        return;
      }
      const tailX = s.x - Math.cos(s.angle) * s.length * s.life;
      const tailY = s.y - Math.sin(s.angle) * s.length * s.life;
      const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(1, `rgba(255,255,255,${s.life * 0.9})`);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
    }

    function animate(ts) {
      time = ts || 0;
      ctx.fillStyle = '#04060e';
      ctx.fillRect(0, 0, W, H);
      drawNebulae();
      drawStars();
      drawPlanet();
      // Shooting star timing
      shootingTimer += 16;
      if (!shootingStar && shootingTimer > 4000 + Math.random() * 8000) {
        spawnShootingStar();
        shootingTimer = 0;
      }
      drawShootingStar();
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(animate);

    // Settings
    async function loadSettings() {
      try {
        const res = await fetch('/api/config/' + PACK_ID);
        const cfg = await res.json();
        if (cfg.starDensity) starDensity = cfg.starDensity;
        if (cfg.showPlanet !== undefined) showPlanet = cfg.showPlanet;
        if (cfg.nebulaIntensity) nebulaIntensity = cfg.nebulaIntensity;
        if (cfg.speed) speed = cfg.speed;
        document.getElementById('starDensitySelect').value = starDensity;
        document.getElementById('showPlanetCheck').checked = showPlanet;
        document.getElementById('nebulaIntensitySelect').value = nebulaIntensity;
        document.getElementById('speedSelect').value = speed;
      } catch {}
      initStars();
      initNebulae();
    }

    async function saveSettings() {
      starDensity = document.getElementById('starDensitySelect').value;
      showPlanet = document.getElementById('showPlanetCheck').checked;
      nebulaIntensity = document.getElementById('nebulaIntensitySelect').value;
      speed = document.getElementById('speedSelect').value;
      initStars();
      initNebulae();
      try {
        await fetch('/api/config/' + PACK_ID, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ starDensity, showPlanet, nebulaIntensity, speed }),
        });
      } catch {}
    }

    function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
    document.addEventListener('click', (e) => {
      const p = document.getElementById('settingsPanel');
      if (!p.contains(e.target) && !e.target.closest('.settings-btn')) p.classList.remove('open');
    });

    function connectSSE() {
      const ind = document.getElementById('sseIndicator');
      const es = new EventSource('/api/events');
      es.onopen = () => ind.classList.add('connected');
      es.addEventListener('packChanged', (e) => {
        const d = JSON.parse(e.data);
        if (d.activePackId !== PACK_ID) window.location.href = '/';
      });
      es.onerror = () => { ind.classList.remove('connected'); es.close(); setTimeout(connectSSE, 5000); };
    }

    loadSettings();
    connectSSE();
  </script>
</body>
</html>
