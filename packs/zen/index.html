<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@100;200;300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060608;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* Breathing circle */
    .breath-ring {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40vh;
      height: 40vh;
      border-radius: 50%;
      border: 1px solid rgba(180,160,220,0.06);
      animation: breathe 8s ease-in-out infinite;
      z-index: 1;
    }
    .breath-ring:nth-child(2) {
      width: 50vh; height: 50vh;
      animation-delay: -1s;
      border-color: rgba(180,160,220,0.03);
    }
    .breath-ring:nth-child(3) {
      width: 60vh; height: 60vh;
      animation-delay: -2s;
      border-color: rgba(180,160,220,0.015);
    }
    @keyframes breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.3; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    .content {
      position: relative;
      z-index: 5;
      text-align: center;
      max-width: 70vw;
      padding: 4vh;
    }

    .quote {
      font-family: 'Cormorant Garamond', serif;
      font-size: min(4vw, 4vh);
      font-weight: 300;
      font-style: italic;
      color: rgba(255,255,255,0.65);
      line-height: 1.5;
      transition: opacity 1.5s ease;
      min-height: 20vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quote.fading { opacity: 0; }

    .author {
      font-family: 'Inter', sans-serif;
      font-size: min(1.5vw, 1.5vh);
      font-weight: 200;
      color: rgba(255,255,255,0.2);
      margin-top: 3vh;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      transition: opacity 1.5s ease;
    }
    .author.fading { opacity: 0; }

    .divider-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(180,160,220,0.15);
      margin: 4vh auto;
    }

    .clock-minimal {
      font-family: 'Inter', sans-serif;
      font-size: min(2.5vw, 2.5vh);
      font-weight: 100;
      color: rgba(255,255,255,0.08);
      letter-spacing: 0.2em;
    }

    .breath-label {
      position: fixed;
      bottom: 5vh;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 200;
      color: rgba(255,255,255,0.06);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      animation: breathText 8s ease-in-out infinite;
    }
    @keyframes breathText {
      0%, 20% { content: 'breathe in'; }
      45%, 55% { opacity: 0.12; }
      80%, 100% { opacity: 0.04; }
    }

    .settings-btn {
      position: fixed; top: 16px; right: 16px;
      background: none; border: none; color: #151515;
      font-size: 22px; cursor: pointer; opacity: 0;
      transition: opacity 0.3s; z-index: 100;
    }
    body:hover .settings-btn { opacity: 1; }
    .settings-panel {
      position: fixed; top: 60px; right: 16px;
      background: rgba(8,8,12,0.95); border: 1px solid #1a1a1a;
      border-radius: 12px; padding: 20px; display: none;
      z-index: 100; min-width: 220px; backdrop-filter: blur(20px);
    }
    .settings-panel.open { display: block; }
    .settings-panel h3 {
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400;
      color: #444; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px;
    }
    .settings-panel label {
      display: flex; align-items: center; gap: 10px;
      color: #777; font-family: 'Inter', sans-serif; font-size: 13px;
      cursor: pointer; padding: 6px 0;
    }
    .settings-panel select {
      background: #0a0a0a; color: #777; border: 1px solid #222;
      border-radius: 6px; padding: 6px 10px; font-size: 13px;
      font-family: 'Inter', sans-serif; width: 100%; margin-top: 4px;
    }
    .settings-panel input[type="checkbox"] { accent-color: #b39ddb; }
    .setting-group { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #111; }
    .setting-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .reload-indicator {
      position: fixed; bottom: 8px; left: 8px;
      width: 5px; height: 5px; border-radius: 50%; background: #0a0a0a; z-index: 20;
    }
    .reload-indicator.connected { background: #4caf50; }
  </style>
</head>
<body>
  <button class="settings-btn" onclick="toggleSettings()">&#9881;</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-group">
      <h3>Interval</h3>
      <label>
        <select id="intervalSelect" onchange="saveSettings()">
          <option value="30">30 seconds</option>
          <option value="60" selected>1 minute</option>
          <option value="120">2 minutes</option>
          <option value="300">5 minutes</option>
        </select>
      </label>
    </div>
    <div class="setting-group">
      <h3>Display</h3>
      <label><input type="checkbox" id="showBreath" checked onchange="saveSettings()" /> Breathing rings</label>
      <label><input type="checkbox" id="showClock" checked onchange="saveSettings()" /> Clock</label>
    </div>
  </div>

  <div class="breath-ring"></div>
  <div class="breath-ring"></div>
  <div class="breath-ring"></div>

  <div class="content">
    <div class="quote" id="quote"></div>
    <div class="author" id="author"></div>
    <div class="divider-dot"></div>
    <div class="clock-minimal" id="clock"></div>
  </div>

  <div class="breath-label" id="breathLabel">breathe</div>
  <div class="reload-indicator" id="sseIndicator"></div>

  <script>
    const PACK_ID = 'zen';
    let interval = 60;
    let showBreath = true;
    let showClock = true;
    let quoteIndex = 0;
    let cycleTimer;

    const QUOTES = [
      { text: "The present moment is filled with joy and happiness. If you are attentive, you will see it.", author: "Thich Nhat Hanh" },
      { text: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" },
      { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
      { text: "Simplicity is the ultimate sophistication.", author: "Leonardo da Vinci" },
      { text: "The mind is everything. What you think you become.", author: "Buddha" },
      { text: "Be yourself; everyone else is already taken.", author: "Oscar Wilde" },
      { text: "Not all those who wander are lost.", author: "J.R.R. Tolkien" },
      { text: "The journey of a thousand miles begins with a single step.", author: "Lao Tzu" },
      { text: "What we think, we become.", author: "Buddha" },
      { text: "Do what you can, with what you have, where you are.", author: "Theodore Roosevelt" },
      { text: "Everything you can imagine is real.", author: "Pablo Picasso" },
      { text: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
      { text: "The best time to plant a tree was 20 years ago. The second best time is now.", author: "Chinese Proverb" },
      { text: "Wherever you go, there you are.", author: "Jon Kabat-Zinn" },
      { text: "Nature does not hurry, yet everything is accomplished.", author: "Lao Tzu" },
      { text: "Silence is a source of great strength.", author: "Lao Tzu" },
      { text: "The quieter you become, the more you can hear.", author: "Ram Dass" },
      { text: "When you realize nothing is lacking, the whole world belongs to you.", author: "Lao Tzu" },
      { text: "Happiness is not something ready made. It comes from your own actions.", author: "Dalai Lama" },
      { text: "Every moment is a fresh beginning.", author: "T.S. Eliot" },
      { text: "What lies behind us and what lies before us are tiny matters compared to what lies within us.", author: "Ralph Waldo Emerson" },
      { text: "The only Zen you find on the tops of mountains is the Zen you bring up there.", author: "Robert M. Pirsig" },
      { text: "Peace comes from within. Do not seek it without.", author: "Buddha" },
      { text: "To see a world in a grain of sand, and a heaven in a wild flower, hold infinity in the palm of your hand, and eternity in an hour.", author: "William Blake" },
    ];

    function showQuote() {
      const q = QUOTES[quoteIndex % QUOTES.length];
      const quoteEl = document.getElementById('quote');
      const authorEl = document.getElementById('author');

      // Fade out
      quoteEl.classList.add('fading');
      authorEl.classList.add('fading');

      setTimeout(() => {
        quoteEl.textContent = `"${q.text}"`;
        authorEl.textContent = `— ${q.author}`;
        quoteEl.classList.remove('fading');
        authorEl.classList.remove('fading');
        quoteIndex++;
      }, 1500);
    }

    function startCycle() {
      if (cycleTimer) clearInterval(cycleTimer);
      showQuote();
      cycleTimer = setInterval(showQuote, interval * 1000);
    }

    function updateClock() {
      const el = document.getElementById('clock');
      if (!showClock) { el.style.opacity = '0'; return; }
      el.style.opacity = '';
      const now = new Date();
      const h = String(now.getHours() % 12 || 12).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      el.textContent = `${h}:${m}`;
    }

    function applyBreath() {
      const rings = document.querySelectorAll('.breath-ring');
      const label = document.getElementById('breathLabel');
      rings.forEach(r => r.style.display = showBreath ? '' : 'none');
      label.style.display = showBreath ? '' : 'none';
    }

    // Breathing label text
    function updateBreathLabel() {
      if (!showBreath) return;
      const phase = (Date.now() % 8000) / 8000;
      const label = document.getElementById('breathLabel');
      label.textContent = phase < 0.5 ? 'breathe in' : 'breathe out';
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/config/' + PACK_ID);
        const cfg = await res.json();
        if (cfg.interval) interval = cfg.interval;
        if (cfg.showBreath !== undefined) showBreath = cfg.showBreath;
        if (cfg.showClock !== undefined) showClock = cfg.showClock;
        document.getElementById('intervalSelect').value = interval;
        document.getElementById('showBreath').checked = showBreath;
        document.getElementById('showClock').checked = showClock;
      } catch {}
      applyBreath();
      updateClock();
      startCycle();
    }
    async function saveSettings() {
      interval = parseInt(document.getElementById('intervalSelect').value);
      showBreath = document.getElementById('showBreath').checked;
      showClock = document.getElementById('showClock').checked;
      applyBreath();
      updateClock();
      startCycle();
      try {
        await fetch('/api/config/' + PACK_ID, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ interval, showBreath, showClock }),
        });
      } catch {}
    }
    function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
    document.addEventListener('click', (e) => {
      const p = document.getElementById('settingsPanel');
      if (!p.contains(e.target) && !e.target.closest('.settings-btn')) p.classList.remove('open');
    });

    function connectSSE() {
      const ind = document.getElementById('sseIndicator');
      const es = new EventSource('/api/events');
      es.onopen = () => ind.classList.add('connected');
      es.addEventListener('packChanged', (e) => {
        const d = JSON.parse(e.data);
        if (d.activePackId !== PACK_ID) window.location.href = '/';
      });
      es.onerror = () => { ind.classList.remove('connected'); es.close(); setTimeout(connectSSE, 5000); };
    }

    loadSettings();
    setInterval(updateClock, 30000);
    setInterval(updateBreathLabel, 500);
    connectSSE();
  </script>
</body>
</html>
